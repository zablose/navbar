services:

  navbar-nginx:
    image: zablose/nginx:1.27
    build:
      context: ./zdi/
      dockerfile: files/nginx.df
      args:
        - ARG_DIR_WEB=${ZDI_DIR_WEB}
        - ARG_ENV=${ZDI_ENV}
        - ARG_TIMEZONE=${ZDI_TIMEZONE}
        - ARG_USER_GROUP_ID=${ZDI_USER_GROUP_ID}
        - ARG_USER_GROUP_NAME=${ZDI_USER_GROUP_NAME}
        - ARG_USER_ID=${ZDI_USER_ID}
        - ARG_USER_NAME=${ZDI_USER_NAME}
    container_name: navbar-nginx
    environment:
      ZDI_CONTAINER_NAME: navbar-nginx
      ZDI_PHP_FPM_HOST: navbar-php-fpm
    ports:
      - '${ZDI_HOST_IP}:80:80'
      - '${ZDI_HOST_IP}:443:443'
    volumes:
      - ./.env:/home/.env
      - ./:${ZDI_DIR_WEB}/
    logging:
      driver: syslog
      options:
        syslog-address: 'tcp://${ZDI_HOST_IP}:514'
        tag: 'docker/navbar-nginx'
    depends_on:
      - navbar-php-fpm
      - navbar-rsyslog
    networks:
      - default

  navbar-php-fpm:
    image: zablose/php-fpm:${ZDI_VERSION_PHP}
    build:
      context: ./zdi/
      dockerfile: files/php-fpm.df
      args:
        - ARG_ADD_COMPOSER=${ZDI_ADD_COMPOSER}
        - ARG_ADD_LARAVEL=${ZDI_ADD_LARAVEL}
        - ARG_DIR_WEB=${ZDI_DIR_WEB}
        - ARG_ENV=${ZDI_ENV}
        - ARG_TIMEZONE=${ZDI_TIMEZONE}
        - ARG_USER_GROUP_ID=${ZDI_USER_GROUP_ID}
        - ARG_USER_GROUP_NAME=${ZDI_USER_GROUP_NAME}
        - ARG_USER_ID=${ZDI_USER_ID}
        - ARG_USER_NAME=${ZDI_USER_NAME}
        - ARG_VERSION_COMPOSER=${ZDI_VERSION_COMPOSER}
        - ARG_VERSION_PHP=${ZDI_VERSION_PHP}
    container_name: navbar-php-fpm
    environment:
      ZDI_CONTAINER_NAME: navbar-php-fpm
      ZDI_DB_HOSTNAME: navbar-mariadb
    volumes:
      - ./.env:/home/.env
      - $HOME/.composer/cache/:/home/${ZDI_USER_NAME}/.composer/cache/
      - ./:${ZDI_DIR_WEB}/
      - ./post-setup.sh:/home/${ZDI_USER_NAME}/post-setup.sh
    logging:
      driver: syslog
      options:
        syslog-address: 'tcp://${ZDI_HOST_IP}:514'
        tag: 'docker/navbar-php-fpm'
    depends_on:
      - navbar-mariadb
      - navbar-rsyslog
    networks:
      - default

  navbar-mariadb:
    image: zablose/mariadb:10.11.6
    build:
      context: ./zdi/
      dockerfile: files/mariadb.df
      args:
        - ARG_ENV=${ZDI_ENV}
        - ARG_TIMEZONE=${ZDI_TIMEZONE}
        - ARG_USER_GROUP_ID=${ZDI_USER_GROUP_ID}
        - ARG_USER_GROUP_NAME=${ZDI_USER_GROUP_NAME}
        - ARG_USER_ID=${ZDI_USER_ID}
        - ARG_USER_NAME=${ZDI_USER_NAME}
    container_name: navbar-mariadb
    environment:
      ZDI_CONTAINER_NAME: navbar-mariadb
    logging:
      driver: syslog
      options:
        syslog-address: 'tcp://${ZDI_HOST_IP}:514'
        tag: 'docker/navbar-mariadb'
    volumes:
      - ./.env:/home/.env
      - navbar_db:/var/lib/mysql/
    depends_on:
      - navbar-rsyslog
    networks:
      - default

  navbar-rsyslog:
    image: zablose/rsyslog:3.19.1
    build:
      context: ./zdi/
      dockerfile: files/rsyslog.df
    container_name: navbar-rsyslog
    ports:
      - '${ZDI_HOST_IP}:514:514'
    volumes:
      - ./laravel/storage/logs/:/var/log/
    networks:
      - default

volumes:
  navbar_db:

networks:
  default:
    name: zdev_default
    driver: bridge
    external: true
